server.port=8080
spring.application.name=personal-agent

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/personal_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=byte1234

# Disable Spring auto-run of schema.sql (we use Flyway instead)
spring.sql.init.mode=never

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.encoding=UTF-8
spring.flyway.mixed=true

# Redis Configuration (no password)
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# Disable auto-configurations that require running Redis
spring.autoconfigure.exclude=

# AI Configuration (DashScope)
spring.ai.dashscope.api-key=sk-265d535de5124a2dbe6d1ed1600538d5
spring.ai.dashscope.model=qwen-plus
spring.ai.dashscope.temperature=0.7

# MyBatis Plus Configuration
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# JWT Configuration
jwt.secret=personal-agent-super-secret-key-for-jwt-token-generation-please-change-this
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger Configuration
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging Configuration
logging.level.com.agent=INFO
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.org.redisson=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=./logs/backend.log
logging.file.max-size=10MB
logging.file.max-history=7
logging.logback.rollingpolicy.file-name-pattern=./logs/backend.%d{yyyy-MM-dd}.%i.log
